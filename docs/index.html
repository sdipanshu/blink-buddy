<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink Buddy</title>
<style>
  :root { color-scheme: light dark; --fg: #2a1d12; --mut: #6e5e50; --bg: #fff; --accent: #c4621d; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5ece4; --mut: #a8988a; --bg: #1c1712; --accent: #e98a3c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 16px; } .mut { color: var(--mut); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Blink Buddy</h1>
  <p class="mut">A gentle 20-20-20 eye break reminder for Chrome, with your own character. Collects no data.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="https://github.com/sdipanshu/blink-buddy">Source code</a> · <a href="https://github.com/sdipanshu/blink-buddy/issues">Report a problem</a></p>
</main>
</body>
</html>

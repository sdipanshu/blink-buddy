<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest your eyes</title>
<link rel="stylesheet" href="style.css">

<body class="reminder">

    <div id="art"></div>
    <h1 id="title">Rest your eyes</h1>

  </section>
  <script src="theme.js"></script>
  <script src="art.js"></script>
  <script src="reminder.js"></script>
</body>
</html>
